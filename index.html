<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFC Pieteikšanās Sistēma</title>

<!--
========================================================================
  NFC PIETEIKŠANĀS SISTĒMA — DOKUMENTĀCIJA
========================================================================

  ŠIS FAILS IR PILNĪGI PATSTĀVĪGA TĪMEKĻA LIETOTNE (HTML+CSS+JS vienā
  failā), kuru var izvietot GitHub Pages (statiskais hostings) bez
  jebkāda servera koda.

  --------------------------------------------------------------------
  1) KĀ IZVEIDOT FIREBASE PROJEKTU
  --------------------------------------------------------------------
  1. Dodies uz https://console.firebase.google.com/
  2. Spied "Add project" / "Pievienot projektu"
  3. Ievadi projekta nosaukumu (piem. "nfc-pieteiksanas") un seko
     norādēm (Google Analytics nav obligāts, vari to izslēgt).
  4. Kad projekts izveidots, konsoles kreisajā izvēlnē atver
     "Build" → "Realtime Database".
  5. Spied "Create Database", izvēlies reģionu (piem. europe-west1),
     un sākumā izvēlies "Start in test mode" (vēlāk skat. 3. sadaļu
     par drošības noteikumiem un noteikti nomaini uz produkcijas
     noteikumiem, ja lietotne tiks lietota reāli).

  --------------------------------------------------------------------
  2) KĀ IEGŪT FIREBASE KONFIGURĀCIJAS DATUS (firebaseConfig)
  --------------------------------------------------------------------
  1. Firebase konsolē spied uz zobrata ikonas augšā pa kreisi →
     "Project settings" / "Projekta iestatījumi".
  2. Sadaļā "Your apps" spied uz "</>" (Web) ikonu, lai reģistrētu
     jaunu web lietotni (nosaukumu vari izvēlēties brīvi).
  3. Firebase parādīs kodu ar objektu, kas izskatās apmēram šādi:

        const firebaseConfig = {
          apiKey: "AIzaSy...",
          authDomain: "tavs-projekts.firebaseapp.com",
          databaseURL: "https://tavs-projekts-default-rtdb.firebaseio.com",
          projectId: "tavs-projekts",
          storageBucket: "tavs-projekts.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcdef123456"
        };

  4. Nokopē šīs vērtības un ielīmē tās zemāk šajā failā sadaļā
     "FIREBASE KONFIGURĀCIJA — IELĪMĒ SAVUS DATUS ŠEIT" (skat. <script>
     tālāk, mainīgo firebaseConfig).
  5. SVARĪGI: "databaseURL" laukam jābūt norādītam obligāti —
     bez tā Realtime Database nestrādās.

  --------------------------------------------------------------------
  3) KĀ IESTATĪT REALTIME DATABASE DROŠĪBAS NOTEIKUMUS (Rules)
  --------------------------------------------------------------------
  Firebase konsolē: Realtime Database → cilne "Rules".

  a) TESTĒŠANAI (ātri sākt, BEZ autentifikācijas, ĒRTI, BET NEDROŠI):

        {
          "rules": {
            ".read": true,
            ".write": true
          }
        }

     ŠO IZMANTO TIKAI TESTĒŠANAI! Jebkurš internetā var lasīt/rakstīt
     tavus datus, ja zina databaseURL.

  b) PRODUKCIJAI (ieteicams — raksta drīkst tikai jaunus ierakstus
     zem /scans, lasīt nedrīkst neviens no ārpuses, izmantojot
     tikai iekšēju validāciju pēc struktūras):

        {
          "rules": {
            "scans": {
              ".read": false,
              ".write": true,
              "$scanId": {
                ".validate": "newData.hasChildren(['cardId','timestamp'])"
              }
            }
          }
        }

     Ja vēlies pilnu drošību ar lietotāju autentifikāciju, izmanto
     Firebase Authentication (piem. Anonymous Auth) un noteikumus
     ".write": "auth != null".

  Pēc izmaiņām spied "Publish" / "Publicēt".

  --------------------------------------------------------------------
  4) KĀ PĀRBAUDĪT, VAI DATI TIEK SAGLABĀTI
  --------------------------------------------------------------------
  1. Firebase konsolē atver "Realtime Database" → cilni "Data".
  2. Kad lietotnē tiek nolasīta NFC karte, dažu sekunžu laikā zem
     mezgla "scans" jāparādās jaunam ierakstam ar laukiem:
     cardId, employee, timestamp, date, time.
  3. Ja dati neparādās:
     - Pārbaudi pārlūka konsoli (F12 → Console) — vai nav kļūdu
       paziņojumu par Firebase savienojumu.
     - Pārliecinies, ka firebaseConfig dati ir pareizi ielīmēti.
     - Pārbaudi, vai "Rules" atļauj rakstīšanu (.write: true vai
       atbilstošs autentifikācijas nosacījums).
     - Pārliecinies, ka ierīcei ir interneta pieslēgums.

  --------------------------------------------------------------------
  5) PIEZĪMES PAR WEB NFC UN GITHUB PAGES
  --------------------------------------------------------------------
  - Web NFC API (NDEFReader) pašlaik strādā TIKAI Chrome pārlūkā
    Android ierīcēs (Chrome 89+), un TIKAI caur HTTPS savienojumu.
  - GitHub Pages automātiski nodrošina HTTPS, tāpēc tas ir piemērots
    hostings risinājums šai lietotnei.
  - Lietotnei jāpiešķir NFC atļauja, kad pārlūks to pieprasa
    (parasti pēc pogas "Ieslēgt NFC" nospiešanas).
  - Karšu saraksts (CARD_DATABASE mainīgais zemāk) jārediģē tieši
    šajā failā — tur jāpievieno savu NFC karšu ID un darbinieku
    vārdi.

========================================================================
-->

<style>
  /* ==================== VISPĀRĪGIE STILI ==================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: #0a0e14;
  }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    color: #e6e9ef;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 12px;
  }

  /* Galvenais konteiners — ierobežots platums Android ekrāniem */
  .app-container {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(180deg, #131822 0%, #0d1117 100%);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    border: 1px solid #1e2530;
  }

  /* ==================== PULKSTENIS ==================== */
  .clock-section {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid #1e2530;
  }

  .clock-time {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #4fd1c5;
    text-shadow: 0 0 20px rgba(79, 209, 197, 0.3);
  }

  .clock-date {
    font-size: 14px;
    color: #6b7280;
    margin-top: 4px;
    text-transform: capitalize;
  }

  /* ==================== NFC STATUSA INDIKATORS ==================== */
  .nfc-status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #e74c3c; /* sarkans = neaktīvs */
    box-shadow: 0 0 8px rgba(231, 76, 60, 0.7);
    transition: all 0.3s ease;
  }

  .status-dot.active {
    background: #2ecc71; /* zaļš = aktīvs */
    box-shadow: 0 0 10px rgba(46, 204, 113, 0.8);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 6px rgba(46, 204, 113, 0.6); }
    50%  { box-shadow: 0 0 16px rgba(46, 204, 113, 1); }
    100% { box-shadow: 0 0 6px rgba(46, 204, 113, 0.6); }
  }

  .status-dot-label {
    font-size: 13px;
    color: #9ca3af;
    letter-spacing: 0.5px;
  }

  /* ==================== STATUSA LAUKS ==================== */
  .status-box {
    background: #0d1117;
    border: 1px solid #232b38;
    border-radius: 14px;
    padding: 22px 16px;
    text-align: center;
    margin-bottom: 18px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .status-box .status-text {
    font-size: 17px;
    font-weight: 500;
    color: #d1d5db;
  }

  .status-box.waiting .status-text {
    color: #f39c12;
  }

  .status-box.success .status-text {
    color: #2ecc71;
  }

  .status-box.error .status-text {
    color: #e74c3c;
  }

  /* ==================== POGA ==================== */
  .btn-nfc {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4fd1c5, #38b2ac);
    color: #04201d;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(79, 209, 197, 0.3);
  }

  .btn-nfc:active {
    transform: scale(0.97);
  }

  .btn-nfc:disabled {
    background: #232b38;
    color: #6b7280;
    box-shadow: none;
    cursor: default;
  }

  /* ==================== PĒDĒJIE SKENĒJUMI ==================== */
  .log-section {
    margin-top: 20px;
  }

  .log-title {
    font-size: 12px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .log-list {
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .log-item {
    background: #0d1117;
    border: 1px solid #1e2530;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .log-item .log-name {
    color: #e6e9ef;
    font-weight: 500;
  }

  .log-item .log-name.unknown {
    color: #e74c3c;
  }

  .log-item .log-time {
    color: #6b7280;
    font-size: 12px;
  }

  /* ==================== POPUP LOGS ==================== */
  .popup-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.25s ease;
    padding: 20px;
  }

  .popup-overlay.show {
    display: flex;
    opacity: 1;
  }

  .popup-box {
    background: #131822;
    border: 1px solid #232b38;
    border-radius: 20px;
    padding: 32px 24px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    transform: translateY(30px);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .popup-overlay.show .popup-box {
    transform: translateY(0);
    opacity: 1;
  }

  .popup-icon {
    font-size: 52px;
    margin-bottom: 14px;
  }

  .popup-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .popup-title.success { color: #2ecc71; }
  .popup-title.error { color: #e74c3c; }

  .popup-text {
    font-size: 15px;
    color: #c5c9d1;
    margin-bottom: 24px;
    line-height: 1.4;
  }

  .btn-close {
    padding: 12px 32px;
    border: none;
    border-radius: 12px;
    background: #232b38;
    color: #e6e9ef;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .btn-close:active {
    background: #2c3646;
  }

  /* ==================== KĻŪDU JOSLA (ja NFC nav pieejams) ==================== */
  .info-banner {
    margin-top: 14px;
    font-size: 12px;
    color: #6b7280;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>

<div class="app-container">

  <!-- PULKSTENIS -->
  <div class="clock-section">

    <div class="clock-date" id="clockDate">-- ---- ----</div>

  <!-- NFC STATUSA INDIKATORS -->
  <div class="nfc-status-row">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-dot-label" id="statusDotLabel">NFC neaktīvs</div>
  </div>

  <!-- STATUSA LAUKS -->
  <div class="status-box waiting" id="statusBox">
    <div class="status-text" id="statusText">Spied "Ieslēgt NFC", lai sāktu</div>

      <!-- ieraksti tiek pievienoti dinamiski ar JS -->
    </div>

</div>

<!-- POPUP PAZIŅOJUMS -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box" id="popupBox">
    <div class="popup-icon" id="popupIcon">👋</div>
    <div class="popup-title success" id="popupTitle">Sveiki!</div>
    <div class="popup-text" id="popupText">Sveiki, Darbinieks!</div>
    <button class="btn-close" id="btnClosePopup">Aizvērt</button>
  </div>
</div>

<!-- ==================== FIREBASE SDK (no CDN) ==================== -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ========================================================================
   FIREBASE KONFIGURĀCIJA — IELĪMĒ SAVUS DATUS ŠEIT
   ========================================================================
   Skat. dokumentāciju augšā HTML komentāros ("2) KĀ IEGŪT FIREBASE
   KONFIGURĀCIJAS DATUS"), lai uzzinātu, kā iegūt šīs vērtības no
   Firebase konsoles (Project settings → Your apps → Web app).
*/
const firebaseConfig = {
  apiKey: "IELĪMĒ_SAVU_API_KEY_ŠEIT",
  authDomain: "IELĪMĒ_SAVU_PROJEKTU.firebaseapp.com",
  databaseURL: "https://IELĪMĒ_SAVU_PROJEKTU-default-rtdb.firebaseio.com",
  projectId: "IELĪMĒ_SAVU_PROJEKTU",
  storageBucket: "IELĪMĒ_SAVU_PROJEKTU.appspot.com",
  messagingSenderId: "IELĪMĒ_SAVU_ID",
  appId: "IELĪMĒ_SAVU_APP_ID"
};

// Inicializējam Firebase lietotni
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ========================================================================
   KARŠU DATUBĀZE — REDIĢĒ ŠO SARAKSTU, LAI PIEVIENOTU SAVAS NFC KARTES
   ========================================================================
   Atslēga = kartes serialNumber (tāds, kādu atgriež Web NFC API,
   parasti formātā "54:e1:59:06" — mazie burti, ar kolonēm).
   Vērtība = darbinieka vārds, kas parādīsies popup logā.
*/
const CARD_DATABASE = new Map([
  ["54:e1:59:06", "Oļegs"],
  ["04:56:78:9a:bc", "EMP-1001"],
  ["a1:b2:c3:d4", "Anna Kalniņa"],
  ["11:22:33:44", "Jānis Bērziņš"]
  // Pievieno savas kartes šeit šādā formātā:
  // ["kartes:id:šeit", "Darbinieka Vārds"],
]);

/* ========================================================================
   ELEMENTU ATSAUCES
   ======================================================================== */
const btnEnableNfc   = document.getElementById('btnEnableNfc');
const statusDot       = document.getElementById('statusDot');
const statusDotLabel  = document.getElementById('statusDotLabel');
const statusBox       = document.getElementById('statusBox');
const statusText      = document.getElementById('statusText');
const infoBanner      = document.getElementById('infoBanner');
const logList         = document.getElementById('logList');

const popupOverlay = document.getElementById('popupOverlay');
const popupBox     = document.getElementById('popupBox');
const popupIcon    = document.getElementById('popupIcon');
const popupTitle   = document.getElementById('popupTitle');
const popupText    = document.getElementById('popupText');
const btnClosePopup = document.getElementById('btnClosePopup');

let ndefReader = null;
let nfcActive = false;
let reconnectTimeout = null;

/* ========================================================================
   PULKSTENIS — atjaunina laiku katru sekundi
   ======================================================================== */
const MENESU_NOSAUKUMI = [
  "janvāris", "februāris", "marts", "aprīlis", "maijs", "jūnijs",
  "jūlijs", "augusts", "septembris", "oktobris", "novembris", "decembris"
];

function atjauninatPulksteni() {
  const tagad = new Date();
  const stundas = String(tagad.getHours()).padStart(2, '0');
  const minutes = String(tagad.getMinutes()).padStart(2, '0');
  const sekundes = String(tagad.getSeconds()).padStart(2, '0');
  document.getElementById('clockTime').textContent = `${stundas}:${minutes}:${sekundes}`;

  const diena = tagad.getDate();
  const menesis = MENESU_NOSAUKUMI[tagad.getMonth()];
  const gads = tagad.getFullYear();
  document.getElementById('clockDate').textContent = `${diena}. ${menesis} ${gads}`;
}
atjauninatPulksteni();
setInterval(atjauninatPulksteni, 1000);

/* ========================================================================
   PALĪGFUNKCIJAS — STATUSA ATJAUNINĀŠANA
   ======================================================================== */
function iestatitNfcAktivu(aktivs) {
  nfcActive = aktivs;
  if (aktivs) {
    statusDot.classList.add('active');
    statusDotLabel.textContent = 'NFC aktīvs';
  } else {
    statusDot.classList.remove('active');
    statusDotLabel.textContent = 'NFC neaktīvs';
  }
}

function iestatitStatusuGaida() {
  statusBox.className = 'status-box waiting';
  statusText.textContent = 'Gaidu karti...';
}

function iestatitStatusuVeiksme(vards) {
  statusBox.className = 'status-box success';
  statusText.textContent = `Pieteikšanās veiksmīga: ${vards}`;
}

function iestatitStatusuKluda(zinojums) {
  statusBox.className = 'status-box error';
  statusText.textContent = zinojums;
}

/* ========================================================================
   PĒDĒJO SKENĒJUMU SARAKSTA ATJAUNINĀŠANA (lokāli, ekrānā)
   ======================================================================== */
function pievienotLogIerakstu(vards, laiks, zinams) {
  const item = document.createElement('div');
  item.className = 'log-item';
  item.innerHTML = `
    <span class="log-name ${zinams ? '' : 'unknown'}">${vards}</span>
    <span class="log-time">${laiks}</span>
  `;
  logList.insertBefore(item, logList.firstChild);

  // Paturam sarakstā ne vairāk kā 15 pēdējos ierakstus
  while (logList.children.length > 15) {
    logList.removeChild(logList.lastChild);
  }
}

/* ========================================================================
   POPUP PAZIŅOJUMU FUNKCIJAS
   ======================================================================== */
function raditPopupVeiksmi(vards) {
  popupIcon.textContent = '👋';
  popupTitle.textContent = 'Sveiki!';
  popupTitle.className = 'popup-title success';
  popupText.textContent = `Sveiki, ${vards}!`;
  raditPopup();
}

function raditPopupNezinamuKarti(kartesId) {
  popupIcon.textContent = '🚫';
  popupTitle.textContent = 'Karte nav reģistrēta';
  popupTitle.className = 'popup-title error';
  popupText.textContent = `Karte ${kartesId} nav reģistrēta sistēmā.`;
  raditPopup();
}

function raditPopup() {
  popupOverlay.classList.add('show');
}

function aizvertPopup() {
  popupOverlay.classList.remove('show');
  // Pēc popup aizvēršanas atgriežamies gaidīšanas statusā
  if (nfcActive) {
    setTimeout(iestatitStatusuGaida, 300);
  }
}

btnClosePopup.addEventListener('click', aizvertPopup);
popupOverlay.addEventListener('click', function(e) {
  // Aizveram popup, ja klikšķis bija tieši uz fona (nevis uz kastītes)
  if (e.target === popupOverlay) {
    aizvertPopup();
  }
});

/* ========================================================================
   FIREBASE — SKENĒJUMA SAGLABĀŠANA REALTIME DATABASE
   ======================================================================== */
function saglabatSkenejumuFirebase(kartesId, darbinieks) {
  const tagad = new Date();
  const unikalsId = db.ref('scans').push().key; // automātiski ģenerēta unikāla atslēga

  const ieraksts = {
    cardId: kartesId,
    employee: darbinieks,
    timestamp: tagad.getTime(),          // Unix laika zīmogs (ms)
    date: tagad.toLocaleDateString('lv-LV'),
    time: tagad.toLocaleTimeString('lv-LV')
  };

  db.ref('scans/' + unikalsId).set(ieraksts)
    .then(() => {
      console.log('✅ Dati veiksmīgi saglabāti Firebase:', ieraksts);
    })
    .catch((kluda) => {
      console.error('❌ Kļūda saglabājot datus Firebase:', kluda);
    });
}

/* ========================================================================
   NFC KARTES APSTRĀDE
   ======================================================================== */
function apstradatNolasitoKarti(serialNumber, message) {
  // Mēģinām iegūt kartes ID no serialNumber; ja tā nav, mēģinām no
  // pirmā NDEF ieraksta datiem
  let kartesId = serialNumber || null;

  if (!kartesId && message && message.records && message.records.length > 0) {
    try {
      const decoder = new TextDecoder();
      kartesId = decoder.decode(message.records[0].data);
    } catch (e) {
      kartesId = 'nezināms-ieraksts';
    }
  }

  if (!kartesId) {
    kartesId = 'nezināma-karte';
  }

  kartesId = kartesId.toLowerCase().trim();

  const tagad = new Date();
  const laiksTekstualos = tagad.toLocaleTimeString('lv-LV');

  // Pārbaudām, vai karte ir mūsu reģistrēto karšu sarakstā
  if (CARD_DATABASE.has(kartesId)) {
    const darbinieks = CARD_DATABASE.get(kartesId);
    iestatitStatusuVeiksme(darbinieks);
    raditPopupVeiksmi(darbinieks);
    pievienotLogIerakstu(darbinieks, laiksTekstualos, true);
    saglabatSkenejumuFirebase(kartesId, darbinieks);
  } else {
    iestatitStatusuKluda('Karte nav reģistrēta');
    raditPopupNezinamuKarti(kartesId);
    pievienotLogIerakstu(`Nezināma karte (${kartesId})`, laiksTekstualos, false);
    saglabatSkenejumuFirebase(kartesId, 'NEZINĀMS');
  }
}

/* ========================================================================
   NFC LASĪTĀJA INICIALIZĀCIJA UN "VIENMĒR IESLĒGTS" LOĢIKA
   ======================================================================== */
async function palaistNfcLasisanu() {
  // Pārbaudām, vai pārlūks atbalsta Web NFC API
  if (!('NDEFReader' in window)) {
    iestatitStatusuKluda('Web NFC nav atbalstīts šajā pārlūkā');
    infoBanner.textContent = 'Web NFC API pieejams tikai Chrome pārlūkā Android ierīcēs (HTTPS savienojumam).';
    btnEnableNfc.disabled = false;
    return;
  }

  try {
    ndefReader = new NDEFReader();
    await ndefReader.scan();

    iestatitNfcAktivu(true);
    iestatitStatusuGaida();
    btnEnableNfc.disabled = true;
    btnEnableNfc.textContent = '✅ NFC ieslēgts';
    infoBanner.textContent = 'NFC klausās nepārtraukti — pietuvini karti ierīcei.';

    // Klausāmies katru nolasīto karti
    ndefReader.onreading = (event) => {
      apstradatNolasitoKarti(event.serialNumber, event.message);
    };

    // Ja rodas kļūda — automātiski mēģinām atjaunot savienojumu
    ndefReader.onreadingerror = () => {
      console.warn('⚠️ NFC nolasīšanas kļūda, mēģinu atjaunot...');
      iestatitStatusuKluda('Nolasīšanas kļūda, atjaunoju...');
      planotAtkartotSavienojumu();
    };

  } catch (kluda) {
    console.error('❌ NFC kļūda:', kluda);
    iestatitNfcAktivu(false);
    iestatitStatusuKluda('NFC kļūda: ' + kluda.message);
    infoBanner.textContent = 'Pārliecinies, ka NFC ir ieslēgts ierīces iestatījumos un lapa atvērta caur HTTPS.';
    btnEnableNfc.disabled = false;
    btnEnableNfc.textContent = '📡 Ieslēgt NFC';

    // Automātiski mēģinām vēlreiz pēc brīža
    planotAtkartotSavienojumu();
  }
}

function planotAtkartotSavienojumu() {
  iestatitNfcAktivu(false);
  if (reconnectTimeout) {
    clearTimeout(reconnectTimeout);
  }
  // Mēģinām atjaunot NFC klausīšanos pēc 3 sekundēm
  reconnectTimeout = setTimeout(() => {
    console.log('🔄 Mēģinu atjaunot NFC savienojumu...');
    palaistNfcLasisanu();
  }, 3000);
}

/* ========================================================================
   POGAS "IESLĒGT NFC" NOTIKUMS
   ======================================================================== */
btnEnableNfc.addEventListener('click', async () => {
  btnEnableNfc.disabled = true;
  btnEnableNfc.textContent = 'Ieslēdzu...';
  await palaistNfcLasisanu();
});

/* ========================================================================
   SĀKOTNĒJĀ PĀRBAUDE PIE LAPAS IELĀDES
   ======================================================================== */
window.addEventListener('load', () => {
  if (!('NDEFReader' in window)) {
    infoBanner.textContent = 'Web NFC API nav pieejams. Lieto Chrome pārlūku Android ierīcē ar HTTPS savienojumu.';
  } else if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    infoBanner.textContent = 'Web NFC prasa HTTPS savienojumu (GitHub Pages to nodrošina automātiski).';
  } else {
    infoBanner.textContent = 'Spied pogu, lai ieslēgtu NFC nolasīšanu.';
  }
});
</script>
