<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Pieteikšanās</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e8edf5;
        }
        .card {
            max-width: 400px;
            width: 100%;
            background: #1a2332;
            border-radius: 32px;
            padding: 30px 24px 34px;
            border: 1px solid #2e3b4e;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .laiks {
            font-size: 3rem;
            font-weight: 700;
            color: #7aa9f0;
            margin: 16px 0 24px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }
        .status-box {
            background: #101a28;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid #2a384b;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #status {
            font-size: 1.3rem;
            font-weight: 500;
        }
        .success { color: #6fcf97; }
        .error { color: #f28b82; }
        .info { color: #7aa9f0; }
        .warning { color: #f9ca24; }
        
        .nfc-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #101a28;
            padding: 12px;
            border-radius: 60px;
            border: 1px solid #263b52;
            margin-bottom: 20px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4c6a8a;
            transition: 0.3s;
        }
        .dot.active {
            background: #2ecc71;
            box-shadow: 0 0 16px #2ecc7180;
        }
        .dot.inactive {
            background: #e74c3c;
        }
        
        button {
            background: #2f8cf0;
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(47, 140, 240, 0.25);
        }
        button:active {
            transform: scale(0.97);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.3s;
        }
        .toast-overlay.show {
            display: flex;
        }
        .toast {
            background: #1a2332;
            padding: 40px 30px;
            border-radius: 32px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            border: 2px solid #2e3b4e;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.3s;
        }
        .toast .icon {
            font-size: 4rem;
            margin-bottom: 12px;
        }
        .toast h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #e8edf5;
        }
        .toast p {
            font-size: 1rem;
            color: #8b9bb5;
            margin-bottom: 4px;
        }
        .toast .employee-id {
            color: #6fcf97;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .toast .error-text {
            color: #f28b82;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .small {
            font-size: 0.75rem;
            color: #5d7390;
            margin-top: 16px;
        }
        
        .debug-info {
            margin-top: 12px;
            padding: 10px;
            background: #0d1624;
            border-radius: 8px;
            font-size: 0.7rem;
            color: #8b9bb5;
            word-break: break-all;
            text-align: left;
            display: none;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            line-height: 1.6;
        }
        .debug-info.show {
            display: block;
        }
        .debug-info .found {
            color: #6fcf97;
        }
        .debug-info .not-found {
            color: #f28b82;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📡 NFC</h1>
    
    <div class="laiks" id="laiks">--:--:--</div>
    
    <div class="status-box">
        <div id="status">Gaidu karti...</div>
    </div>
    
    <div class="nfc-indicator">
        <span style="font-weight:500;">NFC</span>
        <span class="dot" id="nfcDot"></span>
        <span id="nfcStatus" style="font-size:0.85rem; color:#8b9bb5;">izslēgts</span>
    </div>
    
    <button id="nfcPoga">▶ Ieslēgt NFC</button>
    
    <div class="small">Nepieciešama atļauja · Android Web NFC</div>
    
    <!-- Debug informācija -->
    <div class="debug-info" id="debugInfo"></div>
</div>

<!-- TOAST POPUP -->
<div class="toast-overlay" id="toastOverlay">
    <div class="toast">
        <div class="icon" id="toastIcon">✅</div>
        <h2 id="toastTitle">Sveiki!</h2>
        <p id="toastText">Darbinieks</p>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- KARTES UN DARBINIEKI -----
        const kartes = new Map([
            ['54:E1:59:06', 'Oļegs'],
            ['04:53:C0:87:33:02:89', 'J'],
            ['04:03:D4:82:33:02:89', 'Igors'],
            ['A1:B2:C3:D4:E5', 'EMP-3003'],
            ['FF:EE:DD:CC:BB', 'EMP-4004'],
            ['00:11:22:33:44', 'EMP-5005'],
            ['AA:BB:CC:DD:EE', 'EMP-6006'],
            
            // Bez kolu (ja nu)
            ['54E15906', 'Oļegs'],
            ['0453C087330289', 'J'],
            ['0403D482330289', 'Igors'],
            ['A1B2C3D4E5', 'EMP-3003'],
            ['FFEEDDCCBB', 'EMP-4004'],
            ['0011223344', 'EMP-5005'],
            ['AABBCCDDEE', 'EMP-6006'],
        ]);

        const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwsSF837VVaEq5G9Y5iZyoGeviA9nJLk3zMcAsScqtet_bFsjTFVs2Yw5Z1j6LGJnOmUQ/exec';

        // ----- ELEMENTI -----
        const laiksEl = document.getElementById('laiks');
        const statusEl = document.getElementById('status');
        const nfcDot = document.getElementById('nfcDot');
        const nfcStatus = document.getElementById('nfcStatus');
        const poga = document.getElementById('nfcPoga');
        const toastOverlay = document.getElementById('toastOverlay');
        const toastIcon = document.getElementById('toastIcon');
        const toastTitle = document.getElementById('toastTitle');
        const toastText = document.getElementById('toastText');
        const debugInfo = document.getElementById('debugInfo');

        let nfcAktīvs = false;
        let lasītājs = null;
        let toastTimer = null;

        // ----- TOAST -----
        function paraditToast(icon, title, text, isSuccess = true) {
            toastIcon.textContent = icon;
            toastTitle.textContent = title;
            toastTitle.style.color = isSuccess ? '#6fcf97' : '#f28b82';
            toastText.innerHTML = text;
            toastOverlay.classList.add('show');

            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }

            toastTimer = setTimeout(() => {
                toastOverlay.classList.remove('show');
                toastTimer = null;
            }, 2500);
        }

        toastOverlay.addEventListener('click', (e) => {
            if (e.target === toastOverlay) {
                toastOverlay.classList.remove('show');
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
            }
        });

        // ----- LAIKS -----
        function atjaunotLaiku() {
            const tagad = new Date();
            const h = String(tagad.getHours()).padStart(2, '0');
            const m = String(tagad.getMinutes()).padStart(2, '0');
            const s = String(tagad.getSeconds()).padStart(2, '0');
            laiksEl.textContent = `${h}:${m}:${s}`;
        }
        atjaunotLaiku();
        setInterval(atjaunotLaiku, 1000);

        // ----- DATUMS UN LAIKS -----
        function iegūtDatumuLaiku() {
            const tagad = new Date();
            const datums = tagad.toISOString().split('T')[0];
            const laiks = tagad.toTimeString().split(' ')[0];
            return { datums, laiks };
        }

        // ----- SŪTĪT UZ SHEETS -----
        async function sūtītUzSheets(karte, darbinieks, datums, laiks) {
            try {
                await fetch(SHEETS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        date: datums, 
                        time: laiks, 
                        cardId: karte, 
                        employeeId: darbinieks 
                    })
                });
            } catch (err) {
                // Kļūda - nerāda konsolē
            }
        }

        // ----- APSTRĀDĀT KARTI -----
        async function apstrādātKarti(kartesId, source = 'unknown') {
            if (!kartesId) {
                statusEl.textContent = '❌ Nolasīta tukša karte';
                statusEl.className = 'error';
                paraditToast('⚠️', 'Kļūda', 'Karte netika nolasīta pareizi', false);
                return;
            }

            debugInfo.classList.add('show');
            let debugHTML = `<div style="color:#f9ca24;">📱 ID (${source}):</div>`;
            debugHTML += `<div style="color:#fff;margin-bottom:8px;"><strong>${kartesId}</strong></div>`;
            debugHTML += `<div style="color:#5d7390;margin-bottom:8px;">Meklēju kartēs...</div>`;
            
            const formāti = [
                { nosaukums: 'oriģināls', vērtība: kartesId },
                { nosaukums: 'bez kolu', vērtība: kartesId.replace(/:/g, '') },
                { nosaukums: 'lielie burti', vērtība: kartesId.toUpperCase() },
                { nosaukums: 'mazie burti', vērtība: kartesId.toLowerCase() },
                { nosaukums: 'bez kolu + lielie', vērtība: kartesId.replace(/:/g, '').toUpperCase() },
                { nosaukums: 'tikai hekss', vērtība: kartesId.replace(/[^0-9A-Fa-f]/g, '').toUpperCase() },
            ];
            
            let atrasts = null;
            let atrastsFormāts = '';
            
            for (const f of formāti) {
                const meklē = f.vērtība.trim();
                if (meklē && kartes.has(meklē)) {
                    atrasts = kartes.get(meklē);
                    atrastsFormāts = f.nosaukums;
                    debugHTML += `<div class="found">✅ Atrasts formātā "${f.nosaukums}": <strong>${meklē}</strong> → ${atrasts}</div>`;
                    break;
                } else if (meklē) {
                    debugHTML += `<div class="not-found">❌ Nav formātā "${f.nosaukums}": ${meklē}</div>`;
                }
            }
            
            debugInfo.innerHTML = debugHTML;

            if (atrasts) {
                const { datums, laiks } = iegūtDatumuLaiku();
                const teksts = `Sveiki, <span class="employee-id">${atrasts}</span>!`;
                statusEl.textContent = `✅ Pieteikšanās veiksmīga (${atrasts})`;
                statusEl.className = 'success';
                
                paraditToast('👋', 'Sveiki!', teksts, true);
                await sūtītUzSheets(kartesId, atrasts, datums, laiks);
                
            } else {
                statusEl.textContent = '❌ Nepazīstama karte';
                statusEl.className = 'error';
                
                const teksts = `Karte <strong>${kartesId}</strong> nav reģistrēta.`;
                paraditToast('🚫', 'Karte nav reģistrēta', teksts, false);
            }
        }

        // ----- IZLASĪT NDEF IERAKSTUS -----
        function izlasītNDEFIerakstus(message) {
            const dati = [];
            try {
                for (const record of message.records) {
                    if (record.type === 'text' || record.type === 'url') {
                        const decoder = new TextDecoder(record.encoding || 'utf-8');
                        const teksts = decoder.decode(record.data);
                        if (teksts && teksts.length > 0) {
                            dati.push(teksts.trim());
                        }
                    }
                }
            } catch (err) {
                // Kļūda - nerāda konsolē
            }
            return dati;
        }

        // ----- NFC IESLĒGŠANA -----
        async function ieslēgtNFC() {
            if (!('NDEFReader' in window)) {
                statusEl.textContent = '❌ NFC nav pieejams';
                statusEl.className = 'error';
                paraditToast('❌', 'NFC nav pieejams', 'Šī ierīce neatbalsta Web NFC', false);
                return;
            }

            if (nfcAktīvs) {
                statusEl.textContent = '✅ NFC jau darbojas';
                statusEl.className = 'success';
                return;
            }

            try {
                lasītājs = new NDEFReader();
                await lasītājs.scan();
                nfcAktīvs = true;
                nfcDot.className = 'dot active';
                nfcStatus.textContent = 'aktīvs';
                poga.textContent = '⏹ NFC aktīvs';
                poga.disabled = true;
                statusEl.textContent = '📡 Gaidu karti...';
                statusEl.className = 'info';
                debugInfo.classList.remove('show');

                lasītājs.addEventListener('reading', ({ serialNumber, message }) => {
                    let kartesId = null;
                    let avots = 'unknown';
                    
                    if (serialNumber) {
                        kartesId = serialNumber;
                        avots = 'serialNumber';
                    }
                    
                    if (!kartesId && message && message.records) {
                        const ieraksti = izlasītNDEFIerakstus(message);
                        if (ieraksti.length > 0) {
                            kartesId = ieraksti[0];
                            avots = `NDEF (${ieraksti.length} ieraksti)`;
                        }
                    }
                    
                    if (kartesId) {
                        apstrādātKarti(kartesId, avots);
                    } else {
                        statusEl.textContent = '⚠️ Nevar nolasīt kartes ID';
                        statusEl.className = 'error';
                        debugInfo.classList.add('show');
                        debugInfo.innerHTML = `
                            <div style="color:#f28b82;">❌ Nevar nolasīt ID no NFC</div>
                            <div>📋 Serial: ${serialNumber || 'nav'}</div>
                            <div>📋 Message: ${message ? 'ir' : 'nav'}</div>
                        `;
                        paraditToast('⚠️', 'Nolasīšanas kļūda', 'Nevarēja nolasīt kartes identifikatoru', false);
                    }
                });

                lasītājs.addEventListener('error', async () => {
                    statusEl.textContent = '❌ NFC kļūda, mēģina atjaunot...';
                    statusEl.className = 'error';
                    
                    try {
                        await lasītājs.scan();
                        statusEl.textContent = '📡 NFC atjaunots, gaida karti...';
                        statusEl.className = 'info';
                    } catch (e) {
                        statusEl.textContent = '❌ NFC kļūda, lūdzu, pārlādē lapu';
                        statusEl.className = 'error';
                        paraditToast('❌', 'NFC kļūda', 'Radās problēma ar NFC lasītāju. Lūdzu, pārlādē lapu.', false);
                    }
                });

            } catch (err) {
                statusEl.textContent = `❌ Kļūda: ${err.message || 'nezināma'}`;
                statusEl.className = 'error';
                nfcDot.className = 'dot inactive';
                nfcStatus.textContent = 'kļūda';
                paraditToast('❌', 'NFC kļūda', `Nevarēja ieslēgt NFC: ${err.message || 'nezināma kļūda'}`, false);
            }
        }

        // ----- POGAS KLIKŠĶIS -----
        poga.addEventListener('click', ieslēgtNFC);

        // ----- SĀKUMA STĀVOKLIS -----
        if ('NDEFReader' in window) {
            statusEl.textContent = 'Nospiediet "Ieslēgt NFC"';
            statusEl.className = 'info';
        } else {
            statusEl.textContent = '❌ NFC netiek atbalstīts';
            statusEl.className = 'error';
            poga.disabled = true;
        }

    })();
</script>

</body>
</html>
